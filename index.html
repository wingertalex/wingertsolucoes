<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wingert Soluções</title>
  <meta name="theme-color" content="#030b18" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 45%, rgba(0, 157, 255, .13), transparent 34%),
        radial-gradient(circle at 65% 55%, rgba(0, 226, 210, .08), transparent 28%),
        linear-gradient(145deg, #071426 0%, #020812 55%, #00040a 100%);
      font-family: Arial, Helvetica, sans-serif;
    }

    .scene {
      width: min(34vw, 380px);
      aspect-ratio: 1.2 / 1;
      display: grid;
      place-items: center;
      perspective: 1400px;
      position: relative;
    }

    .glow {
      position: absolute;
      width: 72%;
      height: 24%;
      bottom: 10%;
      border-radius: 50%;
      background: rgba(0, 150, 255, .17);
      filter: blur(42px);
      transform: rotateX(72deg);
      animation: pulse 4.8s ease-in-out infinite;
    }

    .logo-wrap {
      width: 100%;
      display: grid;
      place-items: center;
      transform-style: preserve-3d;
      animation: spin 8s linear infinite;
      will-change: transform;
    }

    .logo {
      width: 100%;
      height: auto;
      display: block;
      filter:
        drop-shadow(0 24px 32px rgba(0, 0, 0, .45))
        drop-shadow(0 0 26px rgba(0, 160, 255, .18));
      user-select: none;
      -webkit-user-drag: none;
    }

    @keyframes spin {
      0%   { transform: rotateY(0deg) rotateX(2deg); }
      25%  { transform: rotateY(90deg) rotateX(-1deg); }
      50%  { transform: rotateY(180deg) rotateX(2deg); }
      75%  { transform: rotateY(270deg) rotateX(-1deg); }
      100% { transform: rotateY(360deg) rotateX(2deg); }
    }

    @keyframes pulse {
      0%, 100% { transform: rotateX(72deg) scale(.92); opacity: .65; }
      50%      { transform: rotateX(72deg) scale(1.08); opacity: 1; }
    }

    @media (max-width: 700px) {
      .scene {
        width: 58vw;
      }

      .logo-wrap {
        animation-duration: 10s;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .logo-wrap, .glow {
        animation: none;
      }
    }
  </style>
</head>
