<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>Wingert Soluções</title>
  <meta name="description" content="Wingert Soluções" />

  <style>
    :root{
      --bg:#08090b;
      --text:#f6f7f9;
      --muted:#929aa7;
      --line:rgba(255,255,255,.08);
      --blue:#2d8cff;
      --blue2:#6ab7ff;
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      min-height:100%;
      font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    body{
      overflow-x:hidden;
    }

    .page{
      min-height:100vh;
      min-height:100svh;
      position:relative;
      display:grid;
      place-items:center;
      padding:clamp(14px, 2vw, 28px);
      overflow:hidden;
      background:
        linear-gradient(180deg,rgba(255,255,255,.01),transparent 30%),
        linear-gradient(135deg,#08090b 0%,#0b0d11 48%,#090b0f 100%);
    }

    .page::before{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      background:
        linear-gradient(90deg, transparent 0 8%, rgba(255,255,255,.028) 8.08%, transparent 8.16%),
        linear-gradient(180deg, transparent 0 72%, rgba(255,255,255,.025) 72.08%, transparent 72.16%);
      background-size:220px 100%, 100% 170px;
      opacity:.5;
    }

    .light{
      position:absolute;
      width:min(760px, 70vw);
      height:min(240px, 24vw);
      right:-12%;
      top:18%;
      transform:rotate(-17deg);
      background:linear-gradient(90deg,transparent,rgba(45,140,255,.13),transparent);
      filter:blur(34px);
      pointer-events:none;
    }

    .shell{
      width:min(1120px,100%);
      min-height:min(600px, calc(100svh - 56px));
      display:grid;
      grid-template-columns:minmax(0,1.05fr) minmax(320px,.95fr);
      position:relative;
      z-index:2;
      border:1px solid var(--line);
      background:rgba(12,14,18,.76);
      backdrop-filter:blur(12px);
      border-radius:30px;
      overflow:hidden;
      box-shadow:0 30px 90px rgba(0,0,0,.42);
    }

    .left{
      padding:clamp(32px, 5vw, 74px) clamp(22px, 5vw, 66px);
      display:flex;
      flex-direction:column;
      justify-content:center;
      position:relative;
      z-index:2;
    }

    .brand-mini{
      display:flex;
      align-items:center;
      gap:10px;
      color:#cbd2db;
      font-size:clamp(11px, 1.6vw, 13px);
      font-weight:700;
      letter-spacing:.18em;
      text-transform:uppercase;
      margin-bottom:clamp(22px, 4vw, 42px);
    }

    .brand-mini::before{
      content:"";
      width:28px;
      height:2px;
      background:linear-gradient(90deg,var(--blue),var(--blue2));
      box-shadow:0 0 14px rgba(45,140,255,.5);
      flex:0 0 auto;
    }

    h1{
      margin:0;
      font-size:clamp(42px, 7vw, 92px);
      line-height:.93;
      letter-spacing:-.07em;
      font-weight:850;
      text-wrap:balance;
    }

    .line2{
      color:#9da7b5;
      font-weight:520;
    }

    .accent{
      color:var(--blue2);
      text-shadow:0 0 28px rgba(45,140,255,.16);
    }

    .tagline{
      margin:26px 0 0;
      max-width:520px;
      color:var(--muted);
      font-size:clamp(15px, 1.7vw, 18px);
      line-height:1.65;
      text-wrap:pretty;
    }

    .actions{
      display:flex;
      gap:14px;
      flex-wrap:wrap;
      margin-top:clamp(24px, 4vw, 38px);
    }

    .btn{
      min-height:54px;
      padding:0 22px;
      border-radius:14px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      font-weight:800;
      text-decoration:none;
      transition:.22s ease;
      border:1px solid transparent;
      white-space:nowrap;
    }

    .btn:hover{
      transform:translateY(-2px);
    }

    .btn-primary{
      color:#05101a;
      background:linear-gradient(135deg,#8ed0ff,#4aa4ff);
      box-shadow:0 14px 34px rgba(45,140,255,.18);
    }

    .btn-secondary{
      color:#eef3f8;
      border-color:rgba(255,255,255,.11);
      background:rgba(255,255,255,.025);
    }

    .btn-secondary:hover{
      border-color:rgba(255,255,255,.18);
      background:rgba(255,255,255,.05);
    }

    .right{
      position:relative;
      display:grid;
      place-items:center;
      min-height:320px;
      background:
        linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px),
        linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
        radial-gradient(circle at 50% 50%,rgba(45,140,255,.10),transparent 33%),
        #0d1015;
      background-size:34px 34px,34px 34px,100% 100%,100% 100%;
      border-left:1px solid var(--line);
      overflow:hidden;
    }

    .right::after{
      content:"";
      position:absolute;
      inset:0;
      background:linear-gradient(135deg,transparent 0 52%,rgba(45,140,255,.06) 52.2% 52.5%,transparent 52.7%);
      pointer-events:none;
    }

    .logo-stage{
      position:relative;
      width:min(330px, 72vw);
      aspect-ratio:1 / 1;
      display:grid;
      place-items:center;
    }

    .halo{
      position:absolute;
      inset:16%;
      border-radius:34px;
      border:1px solid rgba(74,164,255,.16);
      transform:rotate(45deg);
      box-shadow:
        0 0 80px rgba(45,140,255,.09),
        inset 0 0 50px rgba(45,140,255,.03);
    }

    .halo::before,
    .halo::after{
      content:"";
      position:absolute;
      background:linear-gradient(90deg,transparent,var(--blue),transparent);
      opacity:.45;
    }

    .halo::before{
      width:140%;
      height:1px;
      left:-20%;
      top:50%;
    }

    .halo::after{
      width:1px;
      height:140%;
      top:-20%;
      left:50%;
      background:linear-gradient(180deg,transparent,var(--blue),transparent);
    }

    .w-wrap{
      position:relative;
      width:min(175px, 40vw);
      aspect-ratio:1 / 1;
      perspective:900px;
    }

    .w-card{
      position:absolute;
      inset:0;
      display:grid;
      place-items:center;
      border-radius:clamp(26px, 4vw, 34px);
      color:white;
      font-size:clamp(74px, 14vw, 92px);
      font-weight:900;
      letter-spacing:-.12em;
      background:
        linear-gradient(145deg,rgba(255,255,255,.065),rgba(255,255,255,.018)),
        #10151c;
      border:1px solid rgba(255,255,255,.10);
      box-shadow:
        0 28px 65px rgba(0,0,0,.38),
        inset 0 1px 0 rgba(255,255,255,.07),
        0 0 46px rgba(45,140,255,.09);
      transform-style:preserve-3d;
      animation:rotateW 7.5s linear infinite;
    }

    .w-card::before{
      content:"";
      position:absolute;
      inset:14px;
      border-radius:24px;
      border:1px solid rgba(74,164,255,.12);
    }

    .w-card span{
      position:relative;
      left:-4px;
      background:linear-gradient(135deg,#ffffff 5%,#9bd2ff 45%,#4b9fff 85%);
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
      text-shadow:0 0 28px rgba(45,140,255,.08);
    }

    .scan{
      position:absolute;
      left:12%;
      right:12%;
      height:1px;
      background:linear-gradient(90deg,transparent,rgba(74,164,255,.8),transparent);
      box-shadow:0 0 15px rgba(74,164,255,.45);
      animation:scan 4.6s ease-in-out infinite;
      opacity:.65;
    }

    .footer{
      position:absolute;
      left:50%;
      bottom:18px;
      transform:translateX(-50%);
      color:#5f6670;
      font-size:11px;
      letter-spacing:.16em;
      text-transform:uppercase;
      z-index:3;
      white-space:nowrap;
      padding-inline:12px;
      text-align:center;
    }

    @keyframes rotateW{
      0%{transform:rotateY(0deg)}
      100%{transform:rotateY(360deg)}
    }

    @keyframes scan{
      0%,100%{top:18%;opacity:.12}
      50%{top:82%;opacity:.8}
    }

    @media (max-width:920px){
      .shell{
        grid-template-columns:1fr;
        min-height:auto;
      }
      .left{
        padding-bottom:34px;
        text-align:center;
      }
      .brand-mini{
        justify-content:center;
      }
      .tagline{
        margin-inline:auto;
      }
      .actions{
        justify-content:center;
      }
      .right{
        min-height:340px;
        border-left:0;
        border-top:1px solid var(--line);
      }
    }

    @media (max-width:640px){
      .page{
        place-items:start center;
        padding-top:14px;
        padding-bottom:14px;
      }
      .shell{
        border-radius:22px;
      }
      .left{
        padding:30px 18px 26px;
      }
      .brand-mini{
        gap:8px;
      }
      .brand-mini::before{
        width:22px;
      }
      .actions{
        flex-direction:column;
      }
      .btn{
        width:100%;
      }
      .right{
        min-height:280px;
      }
      .logo-stage{
        width:min(260px, 72vw);
      }
      .w-wrap{
        width:min(138px, 38vw);
      }
      .footer{
        position:static;
        transform:none;
        margin-top:14px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="light"></div>

    <section class="shell">
      <div class="left">
        <div class="brand-mini">Wingert Soluções</div>

        <h1>
          Ideias.
          <span class="line2">Tecnologia.</span>
          <span class="accent">Conexão.</span>
        </h1>

        <p class="tagline">
          Um ponto de encontro entre tecnologia, experiência e novas possibilidades.
        </p>

        <div class="actions">
          <a
            class="btn btn-primary"
            href="https://wa.me/5551995876752"
            target="_blank"
            rel="noopener">
            WhatsApp
          </a>

          <a
            class="btn btn-secondary"
            href="https://www.linkedin.com/in/alexjrwingert/"
            target="_blank"
            rel="noopener">
            LinkedIn
          </a>
        </div>
      </div>

      <div class="right">
        <div class="scan"></div>

        <div class="logo-stage">
          <div class="halo"></div>

          <div class="w-wrap">
            <div class="w-card">
              <span>W</span>
            </div>
          </div>
        </div>
      </div>
    </section>

    <div class="footer">wingertsolucoes.com.br</div>
  </main>
</body>
</html>
